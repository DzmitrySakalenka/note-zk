[package]
name = "zk-ai"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
provider-http = ["dep:reqwest"]
provider-local = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]
provider-local-cuda = [
    "provider-local",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]
provider-local-metal = [
    "provider-local",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]

[dependencies]
async-trait = "0.1.89"
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokenizers = { version = "0.22.2", default-features = false, features = ["rustls-tls", "onig"], optional = true }
tokio = { version = "1.52.1", features = ["rt", "time", "macros"] }
tracing = "0.1.44"
zk-domain = { version = "0.1.0", path = "../zk-domain" }

[dev-dependencies]
insta = "1.47.2"
wiremock = "0.6.5"
