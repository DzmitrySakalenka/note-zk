[package]
name = "zk-ai"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
provider-http = ["dep:reqwest"]
provider-local = []

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt", "time", "macros"] }
tracing = "0.1.44"
zk-domain = { version = "0.1.0", path = "../zk-domain" }

[dev-dependencies]
wiremock = "0.6.5"
