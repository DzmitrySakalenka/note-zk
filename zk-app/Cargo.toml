[package]
name = "zk-app"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
zk-domain = { path = "../zk-domain" }
toml = "1.1.2"
thiserror = "2.0.18"
serde = "1.0.228"
serde_json = "1.0.149"
zk-vault = { path = "../zk-vault" }
zk-index = { path = "../zk-index" }
rusqlite = { version = "0.39.0", features = ["bundled", "hooks"] }
serde_yaml = "0.9.34"
tracing = "0.1.44"
chrono = { version = "0.4.44", default-features = false, features = ["alloc", "serde"] }
zk-sync = { version = "0.1.0", path = "../zk-sync" }
zk-ai = { version = "0.1.0", path = "../zk-ai", optional = true }

[dev-dependencies]
async-trait = "0.1.89"
pollster = "0.4.0"
tempfile = "3.27.0"
tokio = { version = "1.52.2", features = ["rt", "macros"] }
tracing-subscriber = "0.3.23"
wiremock = "0.6.5"

[features]
ai = ["dep:zk-ai", "zk-ai/provider-local"]
