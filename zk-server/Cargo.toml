[package]
name = "zk-server"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
# TG14 browser-session middleware uses `CookieJar` for request-cookie parsing;
# TG14-016 owns response `Set-Cookie` construction.
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.44", features = ["serde"] }
cookie = "0.18.1"
dirs = "6.0.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
toml = "1.1.2"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "1.2.1"
zk-auth = { version = "0.1.0", path = "../zk-auth" }
zk-domain = { path = "../zk-domain" }

[dev-dependencies]
hex = "0.4.3"
sha2 = "0.11.0"
tempfile = "3.27.0"
