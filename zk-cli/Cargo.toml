[package]
name = "zk-cli"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
futures = { version = "0.3.32", optional = true }
rpassword = "7.5.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["rt", "macros", "net", "sync", "rt-multi-thread"] }
toml = { version = "1.1.2", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
zk-ai = { version = "0.1.0", path = "../zk-ai", optional = true }
zk-app = { path = "../zk-app" }
zk-cli-core = { version = "0.1.0", path = "../zk-cli-core" }
zk-domain = { version = "0.1.0", path = "../zk-domain" }
zk-index = { version = "0.1.0", path = "../zk-index", optional = true }
zk-sync = { version = "0.1.0", path = "../zk-sync" }
zk-vault = { version = "0.1.0", path = "../zk-vault", optional = true }

[dev-dependencies]
assert_cmd = "2.2.1"
axum = "0.8.9"
hex = "0.4.3"
insta = { version = "1.47.2", features = ["yaml"] }
predicates = "3.1.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio-util = "0.7.18"
wiremock = "0.6"
zk-index = { version = "0.1.0", path = "../zk-index" }
zk-server = { path = "../zk-server" }
zk-vault = { version = "0.1.0", path = "../zk-vault" }

[features]
ai = ["dep:futures", "dep:toml", "dep:zk-ai", "dep:zk-index", "dep:zk-vault", "zk-ai/provider-local", "zk-app/ai"]
ai-local = ["ai"]
test-stub-ai = ["ai"]
