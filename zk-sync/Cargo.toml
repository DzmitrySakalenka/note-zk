[package]
name = "zk-sync"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.44", default-features = false, features = ["alloc", "serde"] }
futures = "0.3.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
url = "2"
zk-domain = { path = "../zk-domain" }
zk-index = { version = "0.1.0", path = "../zk-index" }
zk-vault = { version = "0.1.0", path = "../zk-vault" }

[dev-dependencies]
divan = "0.1.21"
insta = { version = "1.47.2", features = ["json"] }
pollster = "0.4.0"
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "macros"] }
ulid = "1.2.1"
wiremock = "0.6"
zk-app = { path = "../zk-app" }

[[bench]]
name = "sync_apply"
harness = false
