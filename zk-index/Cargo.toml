[package]
name = "zk-index"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { version = "1.25.0", features = ["extern_crate_alloc"] }
chrono = { version = "0.4.44", default-features = false, features = ["alloc", "serde"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
time = { version = "0.3.45", features = ["formatting"] }
zk-ai = { version = "0.1.0", path = "../zk-ai" }
zk-domain = { path = "../zk-domain" }

[dev-dependencies]
tempfile = "3.27.0"
