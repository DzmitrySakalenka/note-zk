[package]
name = "zk-vault"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
test-helpers = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.45", features = ["formatting"] }
walkdir = "2.5.0"
zk-domain = { path = "../zk-domain" }

[dev-dependencies]
insta = "1.43.2"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
serde_json = "1.0.149"
